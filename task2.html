<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login & Signup UI</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #6a64d9, #7c3aed);
    }

    .container {
      width: 380px;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .title {
      text-align: center;
      margin-bottom: 25px;
      font-size: 28px;
      color: #333;
    }

    .tabs {
      display: flex;
      margin-bottom: 25px;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #ddd;
    }

    .tab {
      flex: 1;
      padding: 12px;
      border: none;
      cursor: pointer;
      background: #f3f4f6;
      font-size: 16px;
      transition: 0.3s;
    }

    .tab.active {
      background: #4f46e5;
      color: white;
    }

    .form {
      display: none;
    }

    .form.active {
      display: block;
    }

    .input-group {
      margin-bottom: 18px;
    }

    .input-group label {
      display: block;
      margin-bottom: 6px;
      color: #555;
      font-size: 14px;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      background: #4f46e5;
      color: white;
      font-size: 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      background: #3730a3;
    }

    .footer-text {
      text-align: center;
      margin-top: 18px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="title">Welcome</h1>

    <div class="tabs">
      <button class="tab active" onclick="showForm('login')">Login</button>
      <button class="tab" onclick="showForm('signup')">Signup</button>
    </div>

    <!-- Login Form -->
    <form id="login" class="form active">
      <div class="input-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="Enter your password" required>
      </div>

      <button type="submit" class="btn">Login</button>

      <a href="forgotpass.html">Forgot your password</a>
    </form>

    <!-- Signup Form -->
    <form id="signup" class="form">
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" placeholder="Enter your full name" required>
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" placeholder="Enter your email" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="Create a password" required>
      </div>

      <button type="submit" class="btn">Create Account</button>
    </form>
  </div>
