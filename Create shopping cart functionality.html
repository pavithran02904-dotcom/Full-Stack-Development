<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f4f4f4;
    }

    h1 {
      text-align: center;
    }

    .product, .cart {
      background: white;
      padding: 20px;
      margin: 20px auto;
      max-width: 400px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    button {
      padding: 10px 15px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      margin-top: 10px;
    }

    button:hover {
      background: #0056b3;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      padding: 10px;
      border-bottom: 1px solid #ddd;
    }

    .total {
      margin-top: 20px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>Shopping Cart Demo</h1>

  <!-- Product -->
  <div class="product">
    <h2>Wireless Headphones</h2>
    <p>Price: $50</p>

    <button onclick="addToCart()">
      Add to Cart
    </button>
  </div>

  <!-- Cart -->
  <div class="cart">
    <h2>Your Cart</h2>

    <div id="cart-items"></div>

    <div class="total">
      Total: $<span id="total">0</span>
    </div>
  </div>

  <script>
    let total = 0;
    let itemCount = 0;

    function addToCart() {
      itemCount++;

      // Create cart item
      const cartItems = document.getElementById("cart-items");

      const item = document.createElement("div");
      item.classList.add("cart-item");

      item.innerHTML = `
        <span>Wireless Headphones</span>
        <span>$50</span>
      `;

      cartItems.appendChild(item);

      // Update total
      total += 50;
      document.getElementById("total").innerText = total;
    }
  </script>

</body>
</html>
