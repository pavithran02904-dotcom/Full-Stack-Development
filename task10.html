<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reusable UI Components</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f6f9;
      padding:40px;
    }

    h1{
      margin-bottom:30px;
      color:#333;
    }

    .section{
      margin-bottom:40px;
    }

    /* Reusable Button */
    .btn{
      padding:12px 20px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      font-size:16px;
      transition:0.3s;
      margin-right:10px;
    }

    .btn-primary{
      background:#2563eb;
      color:white;
    }

    .btn-primary:hover{
      background:#1e40af;
    }

    .btn-success{
      background:green;
      color:white;
    }

    .btn-success:hover{
      opacity:0.9;
    }

    /* Reusable Card */
    .card{
      background:white;
      padding:20px;
      border-radius:12px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      width:300px;
      margin-top:20px;
    }

    .card h3{
      margin-bottom:10px;
      color:#222;
    }

    .card p{
      color:#555;
      line-height:1.5;
    }

    /* Reusable Input */
    .input-box{
      width:300px;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
      margin-top:10px;
    }

    .input-box:focus{
      border-color:#2563eb;
    }

    /* Reusable Navbar */
    .navbar{
      background:#1f2937;
      padding:15px 20px;
      border-radius:10px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      color:white;
      margin-bottom:30px;
    }

    .navbar ul{
      display:flex;
      list-style:none;
      gap:20px;
    }

    .navbar ul li{
      cursor:pointer;
    }

  </style>
</head>
<body>

  <!-- Reusable Navbar -->
  <div class="navbar">
    <h2>MyApp</h2>

    <ul>
      <li>Home</li>
      <li>About</li>
      <li>Contact</li>
    </ul>
  </div>

  <h1>Reusable UI Components</h1>

  <!-- Buttons -->
  <div class="section">
    <h2>Buttons</h2>

    <button class="btn btn-primary">
      Primary Button
    </button>

    <button class="btn btn-success">
      Success Button
    </button>
  </div>

  <!-- Card -->
  <div class="section">
    <h2>Card Component</h2>

    <div class="card">
      <h3>Card Title</h3>

      <p>
        This is a reusable card component that can be
        used anywhere in the application.
      </p>
    </div>
  </div>

  <!-- Input -->
  <div class="section">
    <h2>Input Component</h2>

    <input
      type="text"
      class="input-box"
      placeholder="Enter text here"
    >
  </div>

</body>
</html>
