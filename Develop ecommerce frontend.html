<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>E-Commerce Frontend</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f4f4;
    }

    /* Header */
    header {
      background: #222;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
    }

    /* Hero Section */
    .hero {
      background: #007bff;
      color: white;
      text-align: center;
      padding: 60px 20px;
    }

    .hero h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    /* Product Section */
    .products {
      padding: 40px 20px;
    }

    .products h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .product-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .product-card:hover {
      transform: translateY(-5px);
    }

    .product-card img {
      width: 100%;
      border-radius: 8px;
    }

    .price {
      color: green;
      font-size: 18px;
      margin: 10px 0;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #0056b3;
    }

    /* Footer */
    footer {
      background: #222;
      color: white;
      text-align: center;
      padding: 15px;
      margin-top: 40px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .hero h1 {
        font-size: 28px;
      }

      header {
        flex-direction: column;
      }

      nav {
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    <h2>MyShop</h2>

    <nav>
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">Cart</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Welcome to MyShop</h1>
    <p>Best products at affordable prices</p>
  </section>

  <!-- Products -->
  <section class="products">
    <h2>Featured Products</h2>

    <div class="product-container">

      <div class="product-card">
        <img src="https://via.placeholder.com/220x200" alt="Product">
        <h3>Wireless Headphones</h3>
        <p class="price">$59.99</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/220x200" alt="Product">
        <h3>Smart Watch</h3>
        <p class="price">$89.99</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/220x200" alt="Product">
        <h3>Running Shoes</h3>
        <p class="price">$49.99</p>
        <button>Add to Cart</button>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/220x200" alt="Product">
        <h3>Backpack</h3>
        <p class="price">$39.99</p>
        <button>Add to Cart</button>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2026 MyShop. All Rights Reserved.</p>
  </footer>

</body>
</html>
