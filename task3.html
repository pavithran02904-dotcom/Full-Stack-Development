<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Forgot Password</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f3f4f6;
    }

    .container{
      background:white;
      padding:40px;
      width:350px;
      border-radius:12px;
      box-shadow:0 5px 20px rgba(0,0,0,0.1);
    }

    h2{
      text-align:center;
      margin-bottom:25px;
      color:#333;
    }

    input{
      width:100%;
      padding:12px;
      margin-bottom:20px;
      border:1px solid #ccc;
      border-radius:8px;
      font-size:15px;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:8px;
      background:#4f46e5;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      background:#3730a3;
    }

    .message{
      margin-top:15px;
      text-align:center;
      color:green;
      font-size:14px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>Forgot Password</h2>

    <form id="forgotForm">

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

     <button onclick="window.location.href='otp.html'">
       Send OTP
     </button>

    </form>

    <p class="message" id="message"></p>

  </div>

  <script>

    const form = document.getElementById("forgotForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event){

      event.preventDefault();

      const email = document.getElementById("email").value;

      // Example validation
      if(email === ""){
        alert("Please enter your email");
        return;
      }

      // Simulated reset link process
      message.innerHTML =
        "Password reset link sent to " + email;

      // Clear input
      form.reset();

    });

  </script>

</body>
</html>
