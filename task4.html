<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>OTP Verification</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f3f4f6;
    }

    .container{
      background:white;
      padding:40px;
      border-radius:14px;
      box-shadow:0 5px 20px rgba(0,0,0,0.1);
      width:350px;
      text-align:center;
    }

    h2{
      margin-bottom:15px;
      color:#333;
    }

    p{
      color:#666;
      margin-bottom:25px;
    }

    .otp-box{
      display:flex;
      justify-content:center;
      gap:10px;
      margin-bottom:25px;
    }

    .otp-box input{
      width:55px;
      height:55px;
      text-align:center;
      font-size:22px;
      border:1px solid #ccc;
      border-radius:10px;
      outline:none;
    }

    .otp-box input:focus{
      border-color:#4f46e5;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      border-radius:10px;
      background:#4f46e5;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    button:hover{
      background:#3730a3;
    }

    .message{
      margin-top:20px;
      font-size:14px;
      color:green;
    }

  </style>
</head>

<body>

  <div class="container">

    <h2>OTP Verification</h2>

    <p>Enter the 4-digit OTP sent to your mobile/email</p>

    <div class="otp-box">

      <input type="text" maxlength="1" class="otp">
      <input type="text" maxlength="1" class="otp">
      <input type="text" maxlength="1" class="otp">
      <input type="text" maxlength="1" class="otp">

    </div>

    <button onclick="verifyOTP()">
      Verify OTP
    </button>

    <div class="message" id="message"></div>

  </div>

  <script>

    const inputs = document.querySelectorAll(".otp");

    // Auto move to next box
    inputs.forEach((input, index) => {

      input.addEventListener("keyup", (e) => {

        if(input.value.length === 1 && index < inputs.length - 1){
          inputs[index + 1].focus();
        }

      });

    });

    function verifyOTP(){

      let otp = "";

      inputs.forEach(input => {
        otp += input.value;
      });

      // Demo OTP
      const correctOTP = "1234";

      const message = document.getElementById("message");

      if(otp === correctOTP){

        message.style.color = "green";
        message.innerHTML = "OTP Verified Successfully";

      }else{

        message.style.color = "red";
        message.innerHTML = "Invalid OTP";

      }

    }

  </script>

</body>
</html>
