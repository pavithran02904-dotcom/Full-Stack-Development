<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Modern Dashboard</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      display:flex;
      min-height:100vh;
      background:#f3f4f6;
    }

    /* Sidebar */

    .sidebar{
      width:250px;
      background:#111827;
      color:white;
      padding:25px;
    }

    .sidebar h2{
      margin-bottom:40px;
      text-align:center;
    }

    .sidebar ul{
      list-style:none;
    }

    .sidebar ul li{
      padding:15px;
      margin-bottom:10px;
      border-radius:8px;
      cursor:pointer;
      transition:0.3s;
    }

    .sidebar ul li:hover{
      background:#374151;
    }

    /* Main Content */

    .main{
      flex:1;
      padding:30px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:30px;
    }

    .topbar input{
      padding:10px;
      width:250px;
      border:1px solid #ccc;
      border-radius:8px;
    }

    /* Cards */

    .cards{
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(220px, 1fr));
      gap:20px;
      margin-bottom:30px;
    }

    .card{
      background:white;
      padding:25px;
      border-radius:14px;
      box-shadow:0 4px 10px rgba(0,0,0,0.08);
    }

    .card h3{
      color:#6b7280;
      margin-bottom:10px;
    }

    .card p{
      font-size:28px;
      font-weight:bold;
      color:#111827;
    }

    /* Table */

    .table-container{
      background:white;
      padding:25px;
      border-radius:14px;
      box-shadow:0 4px 10px rgba(0,0,0,0.08);
      overflow-x:auto;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    table th,
    table td{
      padding:15px;
      text-align:left;
      border-bottom:1px solid #e5e7eb;
    }

    table th{
      background:#f9fafb;
    }

    /* Responsive */

    @media(max-width:768px){

      .sidebar{
        display:none;
      }

      .topbar{
        flex-direction:column;
        gap:15px;
      }

      .topbar input{
        width:100%;
      }

    }

  </style>
</head>

<body>

  <!-- Sidebar -->

  <div class="sidebar">

    <h2>Dashboard</h2>

    <ul>
      <li>Home</li>
      <li>Analytics</li>
      <li>Users</li>
      <li>Reports</li>
      <li>Settings</li>
    </ul>

  </div>

  <!-- Main Content -->

  <div class="main">

    <!-- Topbar -->

    <div class="topbar">

      <h1>Admin Dashboard</h1>

      <input type="text" placeholder="Search...">

    </div>

    <!-- Cards -->

    <div class="cards">

      <div class="card">
        <h3>Total Users</h3>
        <p>1,250</p>
      </div>

      <div class="card">
        <h3>Revenue</h3>
        <p>$8,450</p>
      </div>

      <div class="card">
        <h3>Orders</h3>
        <p>320</p>
      </div>

      <div class="card">
        <h3>Visitors</h3>
        <p>12K</p>
      </div>

    </div>

    <!-- Table -->

    <div class="table-container">

      <h2 style="margin-bottom:20px;">Recent Users</h2>

      <table>

        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Status</th>
          </tr>
        </thead>

        <tbody>

          <tr>
            <td>John Doe</td>
            <td>john@example.com</td>
            <td>Active</td>
          </tr>

          <tr>
            <td>Sarah Smith</td>
            <td>sarah@example.com</td>
            <td>Pending</td>
          </tr>

          <tr>
            <td>Michael Lee</td>
            <td>michael@example.com</td>
            <td>Active</td>
          </tr>

        </tbody>

      </table>

    </div>

  </div>

</body>
</html>
