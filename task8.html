<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Management</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f6f9;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .profile-container{
      width:400px;
      background:white;
      padding:30px;
      border-radius:12px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .profile-header{
      text-align:center;
      margin-bottom:25px;
    }

    .profile-header img{
      width:100px;
      height:100px;
      border-radius:50%;
      object-fit:cover;
      margin-bottom:10px;
    }

    .profile-header h2{
      color:#333;
    }

    form{
      display:flex;
      flex-direction:column;
    }

    label{
      margin:10px 0 5px;
      color:#555;
      font-weight:bold;
    }

    input{
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
    }

    input:focus{
      border-color:#2563eb;
    }

    button{
      margin-top:20px;
      padding:12px;
      border:none;
      background:#2563eb;
      color:white;
      font-size:16px;
      border-radius:8px;
      cursor:pointer;
      transition:0.3s;
    }

    button:hover{
      background:#1e40af;
    }

  </style>
</head>
<body>

  <div class="profile-container">

    <div class="profile-header">
      <img src="https://via.placeholder.com/100" alt="Profile">
      <h2>Profile Settings</h2>
    </div>

    <form>

      <label>Full Name</label>
      <input type="text" placeholder="Enter your name">

      <label>Email Address</label>
      <input type="email" placeholder="Enter your email">

      <label>Phone Number</label>
      <input type="text" placeholder="Enter phone number">

      <label>New Password</label>
      <input type="password" placeholder="Enter new password">

      <button type="submit">
        Update Profile
      </button>

    </form>

  </div>

</body>
</html>
