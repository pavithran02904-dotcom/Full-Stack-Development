<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings Management UI</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f4f6f9;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .settings-container{
      width:450px;
      background:white;
      padding:30px;
      border-radius:12px;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .settings-container h2{
      text-align:center;
      margin-bottom:25px;
      color:#333;
    }

    .setting-item{
      margin-bottom:20px;
    }

    .setting-item label{
      display:block;
      margin-bottom:8px;
      font-weight:bold;
      color:#555;
    }

    input[type="text"],
    input[type="email"],
    select{
      width:100%;
      padding:12px;
      border:1px solid #ccc;
      border-radius:8px;
      outline:none;
    }

    input:focus,
    select:focus{
      border-color:#2563eb;
    }

    .toggle{
      display:flex;
      align-items:center;
      gap:10px;
    }

    .toggle input{
      width:18px;
      height:18px;
    }

    button{
      width:100%;
      padding:12px;
      border:none;
      background:#2563eb;
      color:white;
      font-size:16px;
      border-radius:8px;
      cursor:pointer;
      transition:0.3s;
      margin-top:10px;
    }

    button:hover{
      background:#1e40af;
    }

  </style>
</head>
<body>

  <div class="settings-container">

    <h2>Settings Management</h2>

    <div class="setting-item">
      <label>Username</label>
      <input type="text" placeholder="Enter username">
    </div>

    <div class="setting-item">
      <label>Email Address</label>
      <input type="email" placeholder="Enter email">
    </div>

    <div class="setting-item">
      <label>Theme</label>
      <select>
        <option>Light Mode</option>
        <option>Dark Mode</option>
      </select>
    </div>

    <div class="setting-item toggle">
      <input type="checkbox" id="notify">
      <label for="notify">Enable Notifications</label>
    </div>

    <div class="setting-item toggle">
      <input type="checkbox" id="privacy">
      <label for="privacy">Private Account</label>
    </div>

    <button>
      Save Settings
    </button>

  </div>

</body>
</html>
